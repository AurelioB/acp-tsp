[package]
name = "acp-tsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run Agent Client Protocol (ACP) agents natively in Tern through the Tern Surface Protocol (TSP)"
license = "MIT"
repository = "https://github.com/AurelioB/acp-tsp"
readme = "README.md"
keywords = ["acp", "tern", "tsp", "agent", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["unstable"]
# Every unstable ACP feature the bridge implements; mirrors `agent-client-protocol`'s flags.
unstable = [
    "unstable_end_turn_token_usage",
    "unstable_llm_providers",
    "unstable_mcp_over_acp",
    "unstable_plan_operations",
    "unstable_session_compaction",
    "unstable_session_fork",
    "unstable_session_notices",
    "unstable_subagents",
]
unstable_end_turn_token_usage = ["agent-client-protocol/unstable_end_turn_token_usage"]
unstable_llm_providers = ["agent-client-protocol/unstable_llm_providers"]
unstable_mcp_over_acp = ["agent-client-protocol/unstable_mcp_over_acp"]
unstable_plan_operations = ["agent-client-protocol/unstable_plan_operations"]
unstable_session_compaction = ["agent-client-protocol/unstable_session_compaction"]
unstable_session_fork = ["agent-client-protocol/unstable_session_fork"]
unstable_session_notices = ["agent-client-protocol/unstable_session_notices"]
unstable_subagents = ["agent-client-protocol/unstable_subagents"]

[dependencies]
agent-client-protocol = { version = "3.1", features = ["process"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tern-sdk = "0.1"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
